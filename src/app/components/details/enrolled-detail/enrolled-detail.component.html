<div class="enrolled-courses">
  <h2>Enrolled Courses</h2>
  <div class="courses-list" *ngIf="enrolledCourses$ | async as courses; else noCourses">
    <div class="course-item" *ngFor="let course of courses">
      <div class="course-thumbnail" (click)="onVideoClick(course)" [style.cursor]="course.videoUrl ? 'pointer' : 'default'">
        <img [src]="'data:image/jpeg;base64,' + course.thumbnail" [alt]="course.title" />
        <div class="play-overlay" *ngIf="course.videoUrl">
          <span class="play-icon">▶️</span>
        </div>
      </div>
      <div class="course-info">
        <h3>{{ course.title }}</h3>
        <p class="instructor">{{ course.instructorName }}</p>
        <p class="category">{{ course.category }} • {{ course.topics }}</p>
        <p class="duration">⏱️ {{ formatDuration(course.durationMinutes) }}</p>
      </div>
    </div>
  </div>
  <ng-template #noCourses>
    <p class="no-courses">You haven't enrolled in any courses yet.</p>
  </ng-template>
</div>
