<div class="catalog card" style="margin: 0px 10px 10px; padding: 20px 25px; height: 345px; display: flex; flex-direction: column;">
  <div style="font-size: 14px; display: flex; justify-content: space-between; margin-top: 5px">

    <div style="font-weight: 400; font-weight: 400;
          background: #dbeafe;
          color: #1e40af;
          border-radius: 5px;
          padding: 0px 10px;
          font-size: 12px;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 20px;">{{course['category']}}</div>
    <div>
      <div style="font-size: 12px; color: rgb(234 179 8); display: flex">
        <i style="width: 14px">
          <svg class="svg-inline--fa fa-star" aria-hidden="true" focusable="false" data-prefix="fas" data-icon="star"
            role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512" data-fa-i2svg="">
            <path fill="currentColor"
              d="M316.9 18C311.6 7 300.4 0 288.1 0s-23.4 7-28.8 18L195 150.3 51.4 171.5c-12 1.8-22 10.2-25.7 21.7s-.7 24.2 7.9 32.7L137.8 329 113.2 474.7c-2 12 3 24.2 12.9 31.3s23 8 33.8 2.3l128.3-68.5 128.3 68.5c10.8 5.7 23.9 4.9 33.8-2.3s14.9-19.3 12.9-31.3L438.5 329 542.7 225.9c8.6-8.5 11.7-21.2 7.9-32.7s-13.7-19.9-25.7-21.7L381.2 150.3 316.9 18z">
            </path>
          </svg></i>
        <span style="margin-left: 4px; color:#28313f">4.8</span>
      </div>
    </div>
  </div>
  <div style="font-weight: 500; font-size: 18px; margin-top: 4px">{{course['trainingName']}}</div>
  <div style="font-size: 14px; font-weight: 400; opacity: 0.7; margin-top: 5px; height: 45px">{{course['description']}}</div>
  <div style="font-size: 12px; font-weight: 400; opacity: 0.7; margin-top: 5px">{{course['instructorName']}}</div>
  
  <div style="margin-top: 10px">
    <div style="font-size: 13px; display: flex; justify-content: space-between;margin-top: 5px">
      <div style="opacity: 0.85;">Duration</div>
      <div style="font-weight: 400">{{course['duration']}}</div>
    </div>
    <div style="font-size: 13px; display: flex; justify-content: space-between;margin-top: 5px">
      <div style="opacity: 0.85;">Level</div>
      <div style="font-weight: 400">{{course['level']}}</div>
    </div>
    <div style="font-size: 13px; display: flex; justify-content: space-between;margin-top: 5px">
      <div style="opacity: 0.85;">Modules</div>
      <div style="font-weight: 400">{{course['details'].length}}</div>
    </div>
  </div>
  <div class="actions" style="margin-top: auto">
    
      <button 
      pButton 
      pRipple 
      label="View Course" 
      style="width: 100%"
      class="p-button-primary" (click)="viewCourse()">
  </button>
   
  </div>
</div>
