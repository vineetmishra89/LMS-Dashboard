<div class="dashboard" *ngIf="dashboardData$ | async as data; else loadingTemplate">
  <div class="stats-grid">
    <app-stats-card icon="🏆" iconClass="green" label="Completed Courses" [value]="data.stats.completed"
      (click)="openCompleted()"></app-stats-card>
    <app-stats-card icon="📚" iconClass="blue" label="Enrolled Courses" [value]="data.stats.enrolled"
      (click)="openEnrolled()"></app-stats-card>
    <app-stats-card icon="⏰" iconClass="orange" label="Hours Learned" [value]="data.stats.hours"
      (click)="openHours()"></app-stats-card>
  </div>

  <div class="content-grid">
    <section class="filters-panel">
      <table class="panel-table">
        <thead>
          <tr>
            <th colspan="2">Search Filters</th>
          </tr>
        </thead>
        <tbody>
          <!-- Category -->
          <tr>
            <td class="label">Category</td>
            <td class="control">
              <!-- Native select version -->
              <select [(ngModel)]="pendingFilters.category" class="u-select">
                <option value="">All</option>
                <option *ngFor="let c of data.categories" [value]="c">{{ c }}</option>
              </select>
            </td>
          </tr>
          <tr>
            <td class="label">Topic</td>
            <td class="control">
              <select [(ngModel)]="pendingFilters.topic"  class="u-select">
                <option value="">All</option>
                <option *ngFor="let t of data.topics" [value]="t">{{ t }}</option>
              </select>
            </td>
          </tr>
          <tr>
            <td class="label">Instructor</td>
            <td class="control">
              <select [(ngModel)]="pendingFilters.instructor"
                class="u-select">
                <option value="">All</option>
                <option *ngFor="let i of data.instructors" [value]="i">{{ i }}</option>
              </select>
            </td>
          </tr>
          <tr class="actions-row">
            <td colspan="2" class="actions">
              <button type="button" class="btn" (click)="onClearFilters()">Clear</button>
              <button type="button" class="btn primary" (click)="onApplyFilters()">Apply</button>
            </td>
          </tr>
        </tbody>
      </table>
    </section>

    <main class="catalog card">
      <div class="table-scroll">
        <table class="catalog-table">
          <thead>
            <tr>
              <th class="col-name">Training Name</th>
              <th class="col-desc">Description</th>
              <th class="col-outline">Outline/Content</th>
              <th class="col-duration">Duration</th>
              <th class="col-trainer-fb">Trainers<br>Current feedback</th>
              <th class="col-user-fb">Current User<br>feedback</th>
              <th class="col-review">Review Comments</th>
              <th class="col-trainer">Trainer/Name</th>
              <th class="col-prereq">Pre-requisite</th>
              <th class="col-level">Level (Beginner)</th>
              <th class="col-tools">Tools needed</th>
              <th class="col-action">Action</th>
            </tr>
          </thead>
          <tbody>
            <ng-container *ngIf="catalog$ | async as courses">
              <tr *ngFor="let course of courses">
                <app-course-card [course]="course" [enrollment]="getEnrollmentFor(course.id)" [size]="'small'"
                  [showProgress]="false" (continueClick)="onContinueLearning($event)"
                  (enrollClick)="onCourseEnroll($event)">
                </app-course-card>
              </tr>

            </ng-container>
          </tbody>
        </table>
      </div>
    </main>

    <section class="my-learning" *ngIf="data.continueCourse">
      <h3>My Learning</h3>
      <button type="button" class="continue-btn" (click)="onContinueLearning(data.continueCourse.id, $event)">
        {{ data.continueCourse.title }} – {{ data.continueCourse.progress || 0 }}% complete
      </button>
    </section>
  </div>
</div>

<ng-template #loadingTemplate>
  <div class="loading-container">
    <div class="loading-spinner"></div>
    <p>Loading...</p>
  </div>
</ng-template>
