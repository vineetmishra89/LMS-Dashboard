<div class="video-player-container">
  <div class="video-wrapper" [class.loading]="isLoading" [class.error]="videoError">
    <video 
      #videoElement
      [src]="videoUrl"
      controls
      autoplay
      muted
      preload="metadata"
      (loadedmetadata)="onVideoLoaded()"
      (play)="onPlay()"
      (pause)="onPause()"
      (timeupdate)="onTimeUpdate()"
      (ended)="onVideoEnded()"
      (error)="onVideoError($event)"
      class="video-element">
      Your browser does not support the video tag.
    </video>
    
    <div *ngIf="isLoading" class="loading-overlay">
      <div class="spinner"></div>
      <p>Loading video...</p>
    </div>
    
    <div *ngIf="videoError" class="error-overlay">
      <div class="error-content">
        <div class="error-icon">⚠️</div>
        <h3>Video Playback Error</h3>
        <p class="error-message">{{ videoErrorMessage }}</p>
      </div>
    </div>
  </div>
  
  <!-- Error action buttons outside video wrapper to prevent clipping -->
  <div *ngIf="videoError" class="video-error-actions">
    <button *ngIf="showSignInPrompt" 
            type="button"
            class="signin-btn" 
            (click)="openMicrosoftSignIn()">
      Sign In to Microsoft 365
    </button>
    <button type="button"
            class="retry-btn" 
            (click)="retryVideo()">
      Retry Video
    </button>
  </div>
  
  <div class="progress-info">
    <span>Progress: {{progress | number:'1.1-1'}}%</span>
  </div>
</div>
