@if(authService.isLoggedIn() == false) { 
  <div style="display: flex; align-items: center; justify-content: center; height: 85vh; width: 500px">
    <div class="login-container">
      <header>
        <h1>Welcome</h1>
      </header>
      <form class="login-form" (ngSubmit)="onSubmit()">
        <div class="input-group">
          <label for="username">Empcode or Email</label>
          <input type="text" id="username" name="username" formControlName="email" required />
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" formControlName="password" required />
        </div>
        <button type="submit" class="login-button">Log In</button>
        <button name="ssologin" class="btn btn-primary btn-large" (click)="login()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 12L11 14L15 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M21 12C21 16.418 17.418 20 13 20H9C4.582 20 1 16.418 1 12C1 7.582 4.582 4 9 4H13C17.418 4 21 7.582 21 12Z" stroke="currentColor" stroke-width="2"/>
          </svg>
          Sign In with Microsoft
        </button>
        <div class="footer-links">
          <a href="#">Forgot Password?</a>
          <span>|</span>
          <a href="#">Create Account</a>
        </div>
      </form>
    </div>
  </div>
}
