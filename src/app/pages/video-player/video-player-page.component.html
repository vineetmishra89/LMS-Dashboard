<div class="video-player-page">
  <div class="header">
    <button class="back-button" (click)="goBack()">
      ← Back to Courses
    </button>
    <h1 *ngIf="course">{{course.title}}</h1>
  </div>
  
  <div class="content" *ngIf="!isLoading && course">
    <app-video-player 
      [videoUrl]="course.lmsTrainingDetails[0].videoUrl || course.lmsTrainingDetails[0].trainingLink" 
      [courseId]="course.lmsTrainingDetails[0].id"
      [course]="course">
    </app-video-player>
    
    <div class="course-info">
      <h2>{{course.title}}</h2>
      <p *ngIf="course.description">{{course.description}}</p>
      <div class="meta">
        <span class="instructor">Instructor: {{course.instructorName}}</span>
        <span class="duration">Duration: {{course.durationMinutes}} minutes</span>
        <span class="category">Category: {{course.category}}</span>
      </div>
    </div>
  </div>
  
  <div class="loading" *ngIf="isLoading">
    <div class="spinner"></div>
    <p>Loading course...</p>
  </div>
</div>
