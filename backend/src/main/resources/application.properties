
server.port=5000
server.address=0.0.0.0

# Swagger/OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.disable-swagger-default-url=true

#DB Connection
# Remote DB Connection
spring.datasource.url: jdbc:postgresql://localhost:5555/lmsdb
spring.datasource.username: lmsuser
spring.datasource.password: lms_123

# Local DB Connection
#spring.datasource.url: jdbc:postgresql://localhost:5432/LMS_Local
#spring.datasource.username: postgres
#spring.datasource.password: root

spring.jpa.hibernate.ddl-auto: update
spring.jpa.hibernate.show-sql: true
spring.datasource.driverClassName: org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=lms_schema
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.properties.hibernate.connection.init_sql=SET TIME ZONE 'Asia/Kolkata';

#spring.datasource.url: jdbc:h2:mem:testdb
#spring.datasource.username: sa
#spring.datasource.password:
#spring.datasource.driverClassName: org.h2.Driver

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Hibernate Batch Insert Configuration
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.com.example.graphapi=DEBUG

# JSON formatting
spring.jackson.serialization.indent-output=true

#Target URL
target-url: http://192.168.0.101:8000/processFile
#target-url: http://localhost:8000/processFile

spring.flyway.enabled=false
course.interval= '24 month'

#Sharepoint details
sharepoint-url: https://irissoft-my.sharepoint.com/personal/learning_devel_irissoftware_com/_layouts/15/onedrive.aspx?id=%2Fpersonal%2Flearning%5Fdevel%5Firissoftware%5Fcom%2FDocuments%2FRecordings%5FAll%2FTraining%20Recordings/

# Microsoft Graph API Configuration
# Mode: "onedrive" (default) or "site"
graph.mode: onedrive

# Azure AD App Registration details
graph.tenant-id: your-tenant-id-here
graph.client-id: your-client-id-here
graph.client-secret: your-client-secret-here

# SharePoint/OneDrive Configuration
# For OneDrive for Business (graph.mode=onedrive)
graph.user-principal-name: learning_devel@irissoftware.com
graph.base-path: Documents/Recordings_All/Training Recordings

# For SharePoint Site (graph.mode=site) - uncomment if using SharePoint site instead
#graph.site-hostname: irissoft.sharepoint.com
#graph.site-path: sites/yoursite
#graph.drive-id: your-drive-id-here
#graph.base-path: Documents/Shared


